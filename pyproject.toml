[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaa-kit"
version = "0.1.2"
description = "Inter-annotator agreement metrics and bootstrap confidence intervals for review and labeling workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["inter-annotator-agreement", "krippendorff-alpha", "cohen-kappa", "fleiss-kappa", "gwet", "annotation-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/auraoneai/iaa-kit"
Documentation = "https://github.com/auraoneai/iaa-kit#readme"
Repository = "https://github.com/auraoneai/iaa-kit.git"
Issues = "https://github.com/auraoneai/iaa-kit/issues"
Changelog = "https://github.com/auraoneai/iaa-kit/blob/main/CHANGELOG.md"

[project.scripts]
iaa-kit = "iaa_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
